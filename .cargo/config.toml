[net]
git-fetch-with-cli = true

[build]
rustflags = ["-Z", "threads=12"]
rustc-wrapper = "sccache"
[target.x86_64-unknown-linux-gnu]
linker = "clang"
rustflags = ["-C", "link-arg=-fuse-ld=mold", "-Z", "threads=12"]

[target.x86_64-pc-windows-msvc]
linker = "rust-lld.exe"
rustflags = ["-Z", "threads=12"]

[target.x86_64-pc-windows-gnu]
linker = "x86_64-w64-mingw32-gcc"
rustflags = ["-C", "link-arg=-fuse-ld=lld", "-Z", "threads=12"]

[target.x86_64-apple-darwin]
rustflags = ["-C", "link-arg=-fuse-ld=lld", "-Z", "threads=12"]

[alias]
musl = "build --release --target x86_64-unknown-linux-musl"
win = "build --release --target x86_64-pc-windows-gnu"
c = "check"
r = "run"