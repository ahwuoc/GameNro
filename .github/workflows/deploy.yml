      #       systemctl restart arc_nro

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        
      - name: Build release
        run: cargo build --release --verbose
        
      - name: Create release archive
        run: |
          mkdir -p release
          cp target/release/arc_nro release/
          cp README.md release/
          cp config_arc.toml release/config_arc.toml.example
          tar -czf arc_nro-${{ github.ref_name }}-linux-x86_64.tar.gz -C release .
        
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: arc_nro-${{ github.ref_name }}-linux-x86_64.tar.gz
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
