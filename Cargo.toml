[package]
name = "gamenro"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
sea-orm = { version = "0.12", features = ["sqlx-mysql", "sqlx-sqlite", "runtime-tokio-rustls", "macros"] }
sqlx = { version = "0.7", features = ["mysql", "sqlite", "runtime-tokio-rustls", "chrono"] }
once_cell = "1.19"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
libsqlite3-sys = { version = "0.27", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
rand = "0.9.0"
dotenv = "0.15.0"
anyhow = "1.0.100"
bytes = "1.5"
tracing = "0.1.41"
tracing-subscriber = "0.3.20"
dashmap = "6.1.0"
async-trait = "0.1.89"
sysinfo = "0.37.2"
image = "0.25.9"
fast_image_resize = { version = "6.0.0", features = ["image"] }
[[bin]]
name = "gamenro"
path = "src/main.rs"
