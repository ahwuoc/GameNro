[package]
name = "gamenro"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.0", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }
sea-orm = { version = "0.12", features = ["sqlx-mysql", "runtime-tokio-rustls", "macros"] }
sqlx = { version = "0.7", features = ["mysql", "runtime-tokio-rustls", "chrono"] }
once_cell = "1.19"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
chrono = { version = "0.4", features = ["serde"] }
rand = "0.9.0"
dotenv = "0.15.0"
anyhow = "1.0.100"
bytes = "1.5"
dashmap = "6.1.0"
async-trait = "0.1.89"
sysinfo = "0.37.2"
image = { version = "0.25.9", default-features = false, features = ["png"] }
fast_image_resize = { version = "6.0.0", features = ["image"] }
enum_dispatch = "0.3.13"
[[bin]]
name = "gamenro"
path = "src/main.rs"
